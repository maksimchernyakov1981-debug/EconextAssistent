<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Econext - Каталог микрофибры</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="static/css/style.css">
    <!-- Для GitHub Pages: укажи URL твоего API (Vercel, туннель бота и т.д.) -->
    <script>window.API_BASE_URL = "https://econext-assistent.vercel.app";</script>
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1>🛍️ Econext</h1>
                <div class="header-actions">
                    <button id="cart-btn" class="cart-button">
                        🛒 <span id="cart-count">0</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Navigation Tabs -->
        <nav class="tabs">
            <button class="tab active" data-tab="catalog">Каталог</button>
            <button class="tab" data-tab="ai">🤖 ИИ</button>
            <button class="tab" data-tab="cart">Корзина</button>
            <button class="tab" data-tab="info">ℹ️</button>
        </nav>

        <!-- Loading -->
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Загрузка...</p>
        </div>

        <!-- Error -->
        <div id="error" class="error hidden">
            <p id="error-message"></p>
        </div>

        <!-- Catalog Tab -->
        <div id="catalog-tab" class="tab-content active">
            <div class="search-section">
                <input type="text" id="search-input" placeholder="🔍 Поиск товаров..." class="search-input">
                <button id="search-btn" class="search-btn">Найти</button>
            </div>
            <div id="categories-section" class="section">
                <h2>Категории</h2>
                <button class="btn-primary" onclick="showAllProducts()" style="margin-bottom: 16px;">📦 Показать все товары</button>
                <div id="categories-list" class="categories-grid"></div>
            </div>
            <div id="all-products-section" class="section hidden">
                <div class="section-header">
                    <button id="back-to-categories-from-all" class="back-button">⬅️ Назад</button>
                    <h2>Все товары</h2>
                </div>
                <div id="all-products-list" class="products-grid"></div>
                <div id="all-products-pagination" class="pagination"></div>
            </div>
            <div id="products-section" class="section hidden">
                <div class="section-header">
                    <button id="back-to-categories" class="back-button">⬅️ Назад</button>
                    <h2 id="category-title"></h2>
                </div>
                <div id="products-list" class="products-grid"></div>
                <div id="pagination" class="pagination"></div>
            </div>
            <div id="product-details" class="product-details hidden">
                <button id="back-to-products" class="back-button">⬅️ Назад</button>
                <div id="product-content"></div>
            </div>
        </div>

        <!-- AI Chat Tab -->
        <div id="ai-tab" class="tab-content">
            <div class="ai-chat-container">
                <div id="ai-messages" class="ai-messages"></div>
                <div class="ai-input-container">
                    <input type="text" id="ai-input" placeholder="Задайте вопрос ИИ-консультанту Максиму..." class="ai-input">
                    <button id="ai-send-btn" class="ai-send-btn">Отправить</button>
                </div>
            </div>
        </div>

        <!-- Cart Tab -->
        <div id="cart-tab" class="tab-content">
            <div id="cart-content">
                <div id="cart-empty" class="empty-state">
                    <p>🛒 Ваша корзина пуста</p>
                    <button class="btn-primary" onclick="showTab('catalog')">Перейти в каталог</button>
                </div>
                <div id="cart-items" class="cart-items hidden"></div>
                <div id="cart-summary" class="cart-summary hidden">
                    <div class="summary-row">
                        <span>Товаров:</span>
                        <span id="cart-items-count">0</span>
                    </div>
                    <div class="summary-row">
                        <span>Итого:</span>
                        <span id="cart-total">0 ₽</span>
                    </div>
                    <button id="checkout-btn" class="btn-primary btn-large">Оформить заказ</button>
                </div>
            </div>
        </div>

        <!-- Info Tab -->
        <div id="info-tab" class="tab-content">
            <div class="info-menu">
                <button class="info-menu-item" onclick="showInfoSection('faq')">❓ Частые вопросы</button>
                <button class="info-menu-item" onclick="showInfoSection('order-conditions')">📋 Условия заказа</button>
                <button class="info-menu-item" onclick="showInfoSection('how-to-order')">📋 Как заказать</button>
                <button class="info-menu-item" onclick="showInfoSection('delivery')">🚚 Доставка</button>
                <button class="info-menu-item" onclick="showInfoSection('promotions')">🎁 Акции</button>
                <button class="info-menu-item" onclick="showInfoSection('contacts')">📞 Контакты</button>
                <button class="info-menu-item" onclick="showInfoSection('wholesale')">📦 Оптовая заявка</button>
                <button class="info-menu-item" onclick="showInfoSection('subscription')">🔔 Подписка</button>
                <button class="info-menu-item" onclick="showInfoSection('referral')">🎁 Реферальная программа</button>
                <button class="info-menu-item" onclick="showInfoSection('orders')">📦 Мои заказы</button>
            </div>
            <div id="faq-section" class="info-section hidden">
                <button class="back-button" onclick="hideInfoSection()">⬅️ Назад</button>
                <h2>❓ Частые вопросы</h2>
                <div id="faq-list"></div>
            </div>
            <div id="order-conditions-section" class="info-section hidden">
                <button class="back-button" onclick="hideInfoSection()">⬅️ Назад</button>
                <div id="order-conditions-content"></div>
            </div>
            <div id="how-to-order-section" class="info-section hidden">
                <button class="back-button" onclick="hideInfoSection()">⬅️ Назад</button>
                <div id="how-to-order-content"></div>
            </div>
            <div id="promotions-section" class="info-section hidden">
                <button class="back-button" onclick="hideInfoSection()">⬅️ Назад</button>
                <div id="promotions-content"></div>
            </div>
            <div id="delivery-section" class="info-section hidden">
                <button class="back-button" onclick="hideInfoSection()">⬅️ Назад</button>
                <div id="delivery-content"></div>
            </div>
            <div id="contacts-section" class="info-section hidden">
                <button class="back-button" onclick="hideInfoSection()">⬅️ Назад</button>
                <div id="contacts-content"></div>
            </div>
            <div id="wholesale-section" class="info-section hidden">
                <button class="back-button" onclick="hideInfoSection()">⬅️ Назад</button>
                <h2>📦 Оптовая заявка</h2>
                <form id="wholesale-form" class="checkout-form">
                    <div class="form-group">
                        <label>Ваше имя *</label>
                        <input type="text" name="name" required>
                    </div>
                    <div class="form-group">
                        <label>Контакт (телефон или Telegram) *</label>
                        <input type="text" name="contact" required>
                    </div>
                    <div class="form-group">
                        <label>Ваш вопрос *</label>
                        <textarea name="question" required></textarea>
                    </div>
                    <button type="submit" class="btn-primary btn-large">Отправить заявку</button>
                </form>
            </div>
            <div id="subscription-section" class="info-section hidden">
                <button class="back-button" onclick="hideInfoSection()">⬅️ Назад</button>
                <h2>🔔 Подписка</h2>
                <div id="subscription-status"></div>
                <button id="toggle-subscription-btn" class="btn-primary btn-large">Подписаться</button>
            </div>
            <div id="referral-section" class="info-section hidden">
                <button class="back-button" onclick="hideInfoSection()">⬅️ Назад</button>
                <div id="referral-content"></div>
            </div>
            <div id="orders-section" class="info-section hidden">
                <button class="back-button" onclick="hideInfoSection()">⬅️ Назад</button>
                <h2>📦 Мои заказы</h2>
                <div id="orders-list"></div>
            </div>
        </div>
    </div>

    <div id="checkout-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Оформление заказа</h2>
                <button class="close-btn" onclick="closeCheckoutModal()">✕</button>
            </div>
            <form id="checkout-form" class="checkout-form">
                <div class="form-group">
                    <label>ФИО *</label>
                    <input type="text" name="name" required>
                </div>
                <div class="form-group">
                    <label>Способ доставки *</label>
                    <select name="shipping" required>
                        <option value="post">Почта России</option>
                        <option value="cdek">СДЭК</option>
                        <option value="pyaterochka">Пятёрочка</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Адрес *</label>
                    <textarea name="address" required></textarea>
                </div>
                <div class="form-group">
                    <label>Телефон *</label>
                    <input type="tel" name="phone" required>
                </div>
                <div class="form-group">
                    <label>Telegram</label>
                    <input type="text" name="telegram">
                </div>
                <div class="form-group">
                    <label>Комментарий</label>
                    <textarea name="comment"></textarea>
                </div>
                <button type="submit" class="btn-primary btn-large">Отправить заказ</button>
            </form>
        </div>
    </div>

    <script src="static/js/app.js"></script>
</body>
</html>
