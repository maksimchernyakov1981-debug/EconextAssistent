<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Econext — Каталог и консультант</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div id="app">
        <!-- Header (общий) -->
        <header class="header">
            <button type="button" id="header-back" class="header-back hidden" aria-label="Назад">←</button>
            <h1 class="header-title">🛍️ Econext</h1>
            <button type="button" id="header-cart" class="header-cart" aria-label="Корзина">
                🛒 <span id="cart-count">0</span>
            </button>
        </header>

        <!-- Главное меню (как в боте) -->
        <main id="screen-home" class="screen active">
            <div class="welcome-block">
                <p class="welcome-text">Добро пожаловать! Выберите действие:</p>
            </div>
            <nav class="main-menu">
                <button type="button" class="menu-btn menu-btn-catalog" data-screen="catalog">
                    <span class="menu-btn-icon">🛍️</span>
                    <span class="menu-btn-title">Каталог</span>
                    <span class="menu-btn-desc">Товары по категориям</span>
                </button>
                <button type="button" class="menu-btn menu-btn-ai" data-screen="ai">
                    <span class="menu-btn-icon">🤖</span>
                    <span class="menu-btn-title">Вопрос ИИ</span>
                    <span class="menu-btn-desc">Спросите Максима о товарах</span>
                </button>
                <button type="button" class="menu-btn menu-btn-cart" data-screen="cart">
                    <span class="menu-btn-icon">🛒</span>
                    <span class="menu-btn-title">Корзина</span>
                    <span class="menu-btn-desc" id="home-cart-summary">Пусто</span>
                </button>
                <button type="button" class="menu-btn menu-btn-info" data-screen="info">
                    <span class="menu-btn-icon">ℹ️</span>
                    <span class="menu-btn-title">Информация</span>
                    <span class="menu-btn-desc">Условия, доставка, контакты</span>
                </button>
                <button type="button" class="menu-btn menu-btn-orders" data-screen="orders">
                    <span class="menu-btn-icon">📦</span>
                    <span class="menu-btn-title">Мои заказы</span>
                    <span class="menu-btn-desc">История заказов</span>
                </button>
                <button type="button" class="menu-btn menu-btn-bonus" data-screen="referral">
                    <span class="menu-btn-icon">🎁</span>
                    <span class="menu-btn-title">Бонусы за рекомендации</span>
                    <span class="menu-btn-desc">Реферальная программа</span>
                </button>
            </nav>
        </main>

        <!-- Экран: Каталог -->
        <section id="screen-catalog" class="screen">
            <div class="screen-inner">
                <div class="search-section">
                    <input type="text" id="search-input" placeholder="🔍 Поиск товаров..." class="search-input">
                    <button type="button" id="search-btn" class="search-btn">Найти</button>
                </div>
                <button type="button" class="btn-secondary btn-block" id="btn-show-all-products">📦 Показать все товары</button>
                <div id="categories-section" class="section">
                    <h2 class="section-title">Категории</h2>
                    <div id="categories-list" class="categories-grid"></div>
                </div>
                <div id="all-products-section" class="section hidden">
                    <h2 class="section-title">Все товары</h2>
                    <div id="all-products-list" class="products-grid"></div>
                    <div id="all-products-pagination" class="pagination"></div>
                </div>
                <div id="products-section" class="section hidden">
                    <h2 class="section-title" id="category-title"></h2>
                    <div id="products-list" class="products-grid"></div>
                    <div id="pagination" class="pagination"></div>
                </div>
                <div id="product-details" class="product-details-view hidden">
                    <button type="button" class="back-button" id="back-from-product">← Назад к списку</button>
                    <div id="product-content"></div>
                </div>
            </div>
        </section>

        <!-- Экран: Вопрос ИИ -->
        <section id="screen-ai" class="screen">
            <div class="screen-inner ai-chat-wrap">
                <div id="ai-messages" class="ai-messages"></div>
                <div class="ai-input-row">
                    <input type="text" id="ai-input" placeholder="Задайте вопрос ИИ-консультанту..." class="ai-input">
                    <button type="button" id="ai-send-btn" class="ai-send-btn">Отправить</button>
                </div>
            </div>
        </section>

        <!-- Экран: Корзина -->
        <section id="screen-cart" class="screen">
            <div class="screen-inner">
                <div id="cart-empty" class="empty-state">
                    <p>🛒 Корзина пуста</p>
                    <button type="button" class="btn-primary" data-screen="catalog">Перейти в каталог</button>
                </div>
                <div id="cart-items" class="cart-items hidden"></div>
                <div id="cart-summary" class="cart-summary hidden">
                    <div class="summary-row"><span>Товаров:</span><span id="cart-items-count">0</span></div>
                    <div class="summary-row total"><span>Итого:</span><span id="cart-total">0 ₽</span></div>
                    <button type="button" id="checkout-btn" class="btn-primary btn-large">Оформить заказ</button>
                </div>
            </div>
        </section>

        <!-- Экран: Информация -->
        <section id="screen-info" class="screen">
            <div class="screen-inner">
                <div id="info-menu" class="info-menu">
                    <button type="button" class="info-menu-item" data-info="faq">❓ Частые вопросы</button>
                    <button type="button" class="info-menu-item" data-info="order-conditions">📋 Условия заказа</button>
                    <button type="button" class="info-menu-item" data-info="how-to-order">📋 Как заказать</button>
                    <button type="button" class="info-menu-item" data-info="delivery">🚚 Доставка</button>
                    <button type="button" class="info-menu-item" data-info="promotions">🎁 Акции</button>
                    <button type="button" class="info-menu-item" data-info="contacts">📞 Контакты</button>
                    <button type="button" class="info-menu-item" data-info="wholesale">📦 Оптовая заявка</button>
                    <button type="button" class="info-menu-item" data-info="subscription">🔔 Подписка</button>
                </div>
                <div id="info-content" class="info-content hidden">
                    <div id="faq-section" class="info-section hidden"><div id="faq-list"></div></div>
                    <div id="order-conditions-section" class="info-section hidden"><div id="order-conditions-content"></div></div>
                    <div id="how-to-order-section" class="info-section hidden"><div id="how-to-order-content"></div></div>
                    <div id="delivery-section" class="info-section hidden"><div id="delivery-content"></div></div>
                    <div id="promotions-section" class="info-section hidden"><div id="promotions-content"></div></div>
                    <div id="contacts-section" class="info-section hidden"><div id="contacts-content"></div></div>
                    <div id="wholesale-section" class="info-section hidden">
                        <h2 class="section-title">📦 Оптовая заявка</h2>
                        <form id="wholesale-form" class="checkout-form">
                            <div class="form-group"><label>Ваше имя *</label><input type="text" name="name" required></div>
                            <div class="form-group"><label>Контакт (телефон или Telegram) *</label><input type="text" name="contact" required></div>
                            <div class="form-group"><label>Ваш вопрос *</label><textarea name="question" required></textarea></div>
                            <button type="submit" class="btn-primary btn-large">Отправить заявку</button>
                        </form>
                    </div>
                    <div id="subscription-section" class="info-section hidden">
                        <h2 class="section-title">🔔 Подписка</h2>
                        <div id="subscription-status"></div>
                        <button type="button" id="toggle-subscription-btn" class="btn-primary btn-large">Подписаться</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Экран: Мои заказы -->
        <section id="screen-orders" class="screen">
            <div class="screen-inner">
                <h2 class="section-title">📦 Мои заказы</h2>
                <div id="orders-list" class="orders-list"></div>
            </div>
        </section>

        <!-- Экран: Бонусы / Реферальная программа -->
        <section id="screen-referral" class="screen">
            <div class="screen-inner">
                <div id="referral-content" class="info-text"></div>
            </div>
        </section>

        <!-- Loading -->
        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Загрузка...</p>
        </div>
        <div id="error" class="error hidden"><p id="error-message"></p></div>
    </div>

    <!-- Модальное окно: Оформление заказа -->
    <div id="checkout-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Оформление заказа</h2>
                <button type="button" class="close-btn" id="close-checkout">✕</button>
            </div>
            <form id="checkout-form" class="checkout-form">
                <div class="form-group">
                    <label>ФИО *</label>
                    <input type="text" name="name" required>
                </div>
                <div class="form-group">
                    <label>Способ доставки *</label>
                    <select name="shipping" required>
                        <option value="post">Почта России</option>
                        <option value="cdek">СДЭК</option>
                        <option value="pyaterochka">Пятёрочка</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Адрес *</label>
                    <textarea name="address" required></textarea>
                </div>
                <div class="form-group">
                    <label>Телефон *</label>
                    <input type="tel" name="phone" required>
                </div>
                <div class="form-group">
                    <label>Telegram</label>
                    <input type="text" name="telegram">
                </div>
                <div class="form-group">
                    <label>Комментарий</label>
                    <textarea name="comment"></textarea>
                </div>
                <button type="submit" class="btn-primary btn-large">Отправить заказ</button>
            </form>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
